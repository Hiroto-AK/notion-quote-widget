
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日の名言</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px;
      font-family: system-ui, -apple-system, "Segoe UI",
        "Noto Sans JP", sans-serif;
      background: transparent;
      color: #333;
    }

    .quote-box {
      position: relative;
      background: #f5f5f5;
      border-left: 4px solid #7b9b85;
      border-radius: 8px;
      padding: 16px 18px;
      min-height: 125px;
    }

    .quote-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .next-button {
      border: 1px solid #d5d5d5;
      background: #fff;
      color: #555;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .next-button:hover {
      background: #eaeaea;
    }

    .quote-text {
      font-size: 16px;
      line-height: 1.8;
      margin: 0 0 10px;
      overflow-wrap: anywhere;
    }

    .quote-author {
      font-size: 12px;
      color: #777;
      text-align: right;
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="quote-box">
    <div class="quote-header">
      <button class="next-button" id="nextButton">
        次の名言 →
      </button>
    </div>

    <p class="quote-text" id="quoteText"></p>
    <p class="quote-author" id="quoteAuthor"></p>
  </div>

  <script>
    const quotes = [
      {
        text: " 世界はボクに興味がないからボクは自由だ。",
      },
      {
        text: "信念をつらぬけば、勝っても負けても納得があるだろう。。。"
      },
      {
        text: "間違ってないだけじゃ勝負には勝てないよ。",
      },
      {
        text: "焦らなくていいよ。一歩ずつ進めば大丈夫。",
        author: "アリスのオリジナルメッセージ"
      }
    ];

    // 日付から、その日に表示する名言の番号を決める
    function getDailyIndex() {
      const now = new Date();

      const today = Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      const start = Date.UTC(2026, 0, 1);
      const dayNumber = Math.floor(
        (today - start) / 86400000
      );

      return ((dayNumber % quotes.length) + quotes.length)
        % quotes.length;
    }

    let currentIndex = getDailyIndex();

    function showQuote(index) {
      const quote = quotes[index];

      document.getElementById("quoteText").textContent =
        quote.text;

      document.getElementById("quoteAuthor").textContent =
        "— " + quote.author;
    }

    // 初回表示
    showQuote(currentIndex);

    // ボタンを押したときだけ次の名言へ
    document.getElementById("nextButton")
      .addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % quotes.length;
        showQuote(currentIndex);
      });
  </script>
</body>
</html>
